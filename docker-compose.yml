services:
  triage-assistant:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - APP_ENV=production
      - PORT=5000
      # Set a real SECRET_KEY here (or in a .env file next to this compose
      # file) for anything beyond a single-instance local demo - otherwise
      # one is auto-generated and persisted into the data/ volume below.
      - SECRET_KEY=${SECRET_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_N_THREADS=${LLM_N_THREADS:-}
    volumes:
      # Persists the SQLite database, the auto-generated secret key, and
      # uploaded report files across container restarts/rebuilds.
      - ./data:/app/data
      # Mount the downloaded model weights so they survive image rebuilds -
      # run `docker compose exec triage-assistant python download_model.py`
      # once after first `up` to populate this.
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
